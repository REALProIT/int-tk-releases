<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RealReport - Install</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 820px; margin: 48px auto; padding: 0 20px; }
      .card { border: 1px solid rgba(120,120,120,.35); border-radius: 14px; padding: 18px 18px; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 10px 0; line-height: 1.5; }
      a.button { display: inline-block; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(120,120,120,.45); text-decoration: none; }
      .muted { opacity: .75; font-size: 13px; }
      code { padding: 2px 6px; border-radius: 8px; background: rgba(120,120,120,.15); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>RealReport</h1>
      <p>Installera via ClickOnce:</p>
      <p><a class="button" href="./RealReport.application">Installera/uppdatera</a></p>
      <p class="muted">Om installation blockeras: kontrollera att <code>setup.exe</code> och <code>RealReport.application</code> får laddas ned, och att du kör på Windows.</p>
    </div>
  </body>
</html>
